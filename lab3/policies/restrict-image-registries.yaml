apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: restrict-image-registries
spec:
  validationActions: [Deny]
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [pods]
    namespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: NotIn
          values: [kube-system, kyverno, monitoring, local-path-storage, cnpg-system]
  variables:
    - name: containers
      expression: object.spec.containers + object.spec.?initContainers.orValue([])
    - name: allowed
      expression: "['registry.shop.local/', 'ghcr.io/cloudnative-pg/']"
  validations:
    - expression: >-
        variables.containers.all(c, variables.allowed.exists(p, c.image.startsWith(p)))
      message: Images must come from registry.shop.local or ghcr.io/cloudnative-pg.

    

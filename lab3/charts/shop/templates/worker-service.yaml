apiVersion: v1
kind: Service
metadata:
  name: "{{ .Release.Name }}-worker"
  labels:
    app.kubernetes.io/name: worker
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/part-of: shop
spec:
  # Наружу worker не нужен; Service — для метрик (ServiceMonitor в Части 5).
  selector:
    app.kubernetes.io/name: worker
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: http
      port: {{ .Values.worker.port }}
      targetPort: http

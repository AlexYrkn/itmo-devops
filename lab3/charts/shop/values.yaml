registry: registry.shop.local

api:
  replicas: 4
  image:
    repository: shop-api
    tag: "0.3.0"
  port: 8080
  nodePort: 30080
  healthFail: false
  resources:
    requests: {cpu: 50m, memory: 32Mi}
    limits: {memory: 64Mi}

worker:
  replicas: 2
  image:
    repository: shop-worker
    tag: "0.1.0"
  port: 8081
  pollIntervalSeconds: 5
  resources:
    requests: {cpu: 20m, memory: 32Mi}
    limits: {memory: 64Mi}

postgres:
  instances: 1
  image: ghcr.io/cloudnative-pg/postgresql:18.6
  storage: 1Gi
  resources:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {memory: 512Mi}

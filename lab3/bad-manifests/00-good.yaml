apiVersion: v1
kind: Pod
metadata:
  name: good
  labels:
    app.kubernetes.io/name: good
    app.kubernetes.io/part-of: policy-test
spec:
  containers:
    - name: app
      image: registry.shop.local/shop-api:0.1.0
      env:
        - name: DATABASE_URL
          value: postgres://none@localhost:5432/none
      resources:
        requests: {cpu: 10m, memory: 16Mi}
        limits: {memory: 32Mi}

global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yaml

scrape_configs:
  - job_name: n8n
    static_configs:
      - targets: ["n8n:5678"]

  - job_name: pushgateway
    honor_labels: true
    static_configs:
      - targets: ["pushgateway:9091"]

  - job_name: dependencies
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          - http://host.docker.internal:11434/api/version
        labels: { dependency: ollama }
      - targets:
          - http://github-mcp:8000/healthz
        labels: { dependency: github-mcp }
      - targets:
          - http://filesystem-mcp:8000/healthz
        labels: { dependency: filesystem-mcp }
      - targets:
          - https://www.githubstatus.com/api/v2/status.json
        labels: { dependency: github }
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115
